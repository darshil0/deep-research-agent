name: CI/CD Security & Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Security Check - No Hardcoded Secrets
        run: |
          echo "Checking for hardcoded secrets in code..."
          # Scan for common secret patterns
          if grep -rE "(AUTH_TOKEN|API_KEY|SECRET|PASSWORD|APISECRET)=['\"][^'\"]+['\"]" --include="*.js" --include="*.ts" --include="*.env" . 2>/dev/null; then
            echo "ERROR: Potential hardcoded secrets detected!"
            exit 1
          fi
          echo "No hardcoded secrets found"

      - name: Security Check - .env File Not Commited
        run: |
          echo "Checking if .env file is in repository..."
          if [ -f ".env" ]; then
            echo "ERROR: .env file should not be committed to the repository!"
            exit 1
          fi
          echo ".env file not present (good)"

      - name: Security Check - Dependencies Audit
        run: |
          echo "Running npm audit..."
          npm audit --production || {
            echo "WARNING: npm audit found issues (non-fatal)"
          }
          echo "npm audit completed"
