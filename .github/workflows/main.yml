name: CI/CD Security & Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, Test, and Security Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify required project files
        shell: bash
        run: |
          set -euo pipefail

          test -f package.json || {
            echo "::error::package.json was not found."
            exit 1
          }

          test -f package-lock.json || {
            echo "::error::package-lock.json was not found. npm ci requires a committed lockfile."
            exit 1
          }

      - name: Install dependencies
        shell: bash
        run: npm ci

      - name: Lint
        shell: bash
        run: npm run lint --if-present

      - name: Run tests
        shell: bash
        run: npm test --if-present

      - name: Security check - Prevent committed environment files
        shell: bash
        run: |
          set -euo pipefail

          tracked_env_files="$(
            git ls-files \
              -- '.env' '.env.*' \
              ':!.env.example' \
              ':!.env.template' \
              ':!.env.sample'
          )"

          if [ -n "$tracked_env_files" ]; then
            echo "::error::Sensitive environment files are tracked by Git:"
            echo "$tracked_env_files"
            exit 1
          fi

          echo "No sensitive .env files are tracked by Git."

      - name: Security check - Detect likely hardcoded secrets
        shell: bash
        run: |
          set -euo pipefail

          echo "Scanning tracked source files for likely hardcoded secrets..."

          secret_pattern='(API[_-]?KEY|API[_-]?SECRET|AUTH[_-]?TOKEN|ACCESS[_-]?TOKEN|SECRET|PASSWORD|PRIVATE[_-]?KEY)[[:space:]]*[:=][[:space:]]*["'\''][^"'\'']{8,}["'\'']'

          matches="$(
            git grep -nEI \
              -- '*.js' '*.jsx' '*.ts' '*.tsx' '*.mjs' '*.cjs' \
              '*.json' '*.yml' '*.yaml' '*.env' \
              -e "$secret_pattern" \
              || true
          )"

          if [ -n "$matches" ]; then
            echo "::error::Potential hardcoded secret values were detected:"
            echo "$matches"
            echo
            echo "Use GitHub Actions secrets, repository/environment variables, or a managed secret store instead."
            exit 1
          fi

          echo "No likely hardcoded secrets found in tracked files."

      - name: Security check - Production dependency audit
        shell: bash
        run: |
          set -euo pipefail

          echo "Auditing production dependencies for high- and critical-severity vulnerabilities..."
          npm audit --omit=dev --audit-level=high
